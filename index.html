<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>produce123 · 个人主页</title>
  <meta name="description" content="produce123 的个人主页——用 Claude Code 打造效率工具与创意应用。">
  <link rel="icon" href="assets/favicon.png">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            neon: { cyan: '#22d3ee', green: '#4ade80', pink: '#f472b6' },
          },
          fontFamily: {
            sans: ['"PingFang SC"', '"Microsoft YaHei"', '-apple-system', '"Segoe UI"', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark">
  <!-- ═══ Hamburger ═══ -->
  <button id="menu-btn" class="fixed top-4 left-4 z-50 w-11 h-11 flex items-center justify-center rounded-xl bg-white/5 backdrop-blur-md border border-white/10 text-gray-400 hover:text-white hover:border-cyan-400/50 transition-all duration-200 touch-manipulation" aria-label="菜单">
    <i class="fas fa-bars text-lg"></i>
  </button>

  <!-- ═══ Theme toggle ═══ -->
  <button id="theme-btn" class="fixed top-4 right-4 z-50 w-11 h-11 flex items-center justify-center rounded-xl bg-white/5 backdrop-blur-md border border-white/10 text-gray-400 hover:text-white hover:border-cyan-400/50 transition-all duration-200 touch-manipulation" aria-label="切换主题">
    <i class="fas fa-moon text-lg"></i>
  </button>

  <!-- ═══ Drawer overlay ═══ -->
  <div id="drawer-overlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden transition-opacity duration-300"></div>

  <!-- ═══ Drawer (slide from left) ═══ -->
  <nav id="drawer" class="fixed top-0 left-0 h-full w-72 max-w-[80vw] z-50 transform -translate-x-full transition-transform duration-300 ease-out shadow-2xl flex flex-col">
    <!-- Header -->
    <div class="flex items-center gap-3 px-6 py-6 border-b border-white/10 shrink-0">
      <img src="assets/avatar.png" alt="avatar" class="w-11 h-11 rounded-full border-2 border-cyan-400/60 shadow-lg shadow-cyan-400/20">
      <div>
        <p class="font-bold text-white tracking-wide">produce123</p>
        <p class="text-xs text-gray-400">Personal Site</p>
      </div>
    </div>
    <!-- Menu items -->
    <div class="flex-1 overflow-y-auto px-4 py-4 space-y-1">
      <a href="#/" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-cyan-400 hover:bg-white/5 transition-all" data-route="/">
        <i class="fas fa-home w-5 text-center"></i><span>首页</span>
      </a>
      <a href="#/profile" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-cyan-400 hover:bg-white/5 transition-all" data-route="/profile">
        <i class="fas fa-user w-5 text-center"></i><span>个人主页</span>
      </a>
      <a href="#/projects" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-cyan-400 hover:bg-white/5 transition-all" data-route="/projects">
        <i class="fas fa-code w-5 text-center"></i><span>项目</span>
      </a>
      <a href="#/feed" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-cyan-400 hover:bg-white/5 transition-all" data-route="/feed">
        <i class="fas fa-comment-dots w-5 text-center"></i><span>说说</span>
      </a>
      <a href="#/music" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-cyan-400 hover:bg-white/5 transition-all" data-route="/music">
        <i class="fas fa-music w-5 text-center"></i><span>音乐</span>
      </a>
    </div>
    <!-- Footer -->
    <div class="px-6 py-4 border-t border-white/10 text-center text-xs text-gray-500 shrink-0">
      © <span id="footer-year">2026</span> produce123
    </div>
  </nav>

  <!-- ═══ Main app container ═══ -->
  <main id="app" class="min-h-screen"></main>

  <!-- ═══ Lightbox ═══ -->
  <div id="lightbox" class="fixed inset-0 z-60 bg-black/80 backdrop-blur-md hidden items-center justify-center">
    <img id="lightbox-img" class="max-w-[90vw] max-h-[90vh] rounded-2xl shadow-2xl cursor-default select-none" src="" alt="完整图片">
    <p class="absolute bottom-10 text-gray-400 text-sm pointer-events-none">点击灰色区域关闭</p>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
